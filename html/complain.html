<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/complain.css">
    <title>现代化地府政务服务平台</title>
    <script src="../js/libs/jquery-3.7.1.js"></script>
    <script>
      $(document).ready(function(){
        $("header").load("./framework/header.html");
        $("aside").load("./framework/sidebar.html");
        $("footer").load("./framework/footer.html");
      });
    </script>
</head>
<body>
  <header>

  </header>
    <section class="banner">
        <h1>现代化地府综合申诉平台</h1>
        <p>不满意吗？我们下辈子会改的。嗯，下辈子</p>
    </section>
    
    <div class="form-container">
        <div class="form-group">
            <label for="appeal-type">申诉类型</label>
            <select id="appeal-type" class="form-control">
                <option value="">请选择申诉类型</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="appeal-event">申诉事件</label>
            <input type="text" id="appeal-event" class="form-control" placeholder="">
        </div>
        
        <div class="form-group">
            <label for="appeal-reason">申诉理由</label>
            <textarea id="appeal-reason" class="form-control" placeholder=""></textarea>
        </div>
        
        <button type="submit" class="btn-submit">立即申诉</button>
    </div>
    <aside></aside>
</body>
    <footer></footer>
</html>
